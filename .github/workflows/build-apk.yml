
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar clave de firma de depuración
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ecos-debug-signing-key-v1

      - name: Comprobar archivos del proyecto
        run: |
          echo "Contenido del manifiesto:"
          cat -n app/src/main/AndroidManifest.xml
          echo ""
          echo "Archivos principales:"
          find app/src/main -maxdepth 6 -type f

      - name: Validar AndroidManifest.xml
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ruta = "app/src/main/AndroidManifest.xml"
          try:
              ET.parse(ruta)
              print("XML correcto")
          except ET.ParseError as e:
              print(f"ERROR XML: {e}")
              raise
          PY

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EcosDelEquilibrio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
